<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 468" width="720" height="468" role="img" aria-labelledby="t d"><title id="t">Exact-version retrieval accuracy</title><desc id="d">Top-1 result must be the expected record version; synthetic workloads, 50 entities each</desc>
<style>
  svg { --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #8a8984;
        --grid: #e4e3df; --s1: #2a78d6; --s2: #eb6834; }
