<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 376" width="720" height="376" role="img" aria-labelledby="t d"><title id="t">Latency of one dated search, cold and warm</title><desc id="d">Cold opens the store and builds a new retriever for each search, like one CLI call, excluding interpreter start-up. Warm reuses one store and retriever for every search. Medians of 20 searches each (log scales)</desc>
<style>
  svg { --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #8a8984;
        --grid: #e4e3df; --s1: #2a78d6; --s2: #eb6834; }
  @media (prefers-color-scheme: dark) {
    svg { --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #8f8e88;
          --grid: #33332f; --s1: #3987e5; --s2: #d95926; }
  }
  .bg { fill: var(--surface); }
  .title { fill: var(--ink); font: 600 15px system-ui, -apple-system, sans-serif; }
  .sub { fill: var(--ink-2); font: 12px system-ui, -apple-system, sans-serif; }
  .tick { fill: var(--muted); font: 11px system-ui, -apple-system, sans-serif; }
  .label { fill: var(--ink); font: 600 12px system-ui, -apple-system, sans-serif; }
  .value { fill: var(--ink-2); font: 12px system-ui, -apple-system, sans-serif; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--muted); stroke-width: 1; }
  .s1 { stroke: var(--s1); fill: var(--s1); }
  .s2 { stroke: var(--s2); fill: var(--s2); }
  .line { fill: none; stroke-width: 2; stroke-linejoin: round; }
  .dash { stroke-dasharray: 7 4; }
  .dot { stroke: var(--surface); stroke-width: 2; }
</style>
<rect class="bg" width="720" height="376" rx="8"/><text class="title" x="24" y="32">Latency of one dated search, cold and warm</text><text class="sub" x="24" y="52">Cold opens the store and builds a new retriever for each search, like one CLI call, excluding interpreter start-up.</text><text class="sub" x="24" y="68">Warm reuses one store and retriever for every search. Medians of 20 searches each (log scales)</text><line class="grid" x1="72" x2="570" y1="316.0" y2="316.0"/><text class="tick" x="64" y="320.0" text-anchor="end">1.0 ms</text><line class="grid" x1="72" x2="570" y1="260.0" y2="260.0"/><text class="tick" x="64" y="264.0" text-anchor="end">10 ms</text><line class="grid" x1="72" x2="570" y1="204.0" y2="204.0"/><text class="tick" x="64" y="208.0" text-anchor="end">100 ms</text><line class="grid" x1="72" x2="570" y1="148.0" y2="148.0"/><text class="tick" x="64" y="152.0" text-anchor="end">1,000 ms</text><line class="grid" x1="72" x2="570" y1="92.0" y2="92.0"/><text class="tick" x="64" y="96.0" text-anchor="end">10,000 ms</text><text class="tick" x="72.0" y="336" text-anchor="middle">300</text><text class="tick" x="243.0" y="336" text-anchor="middle">1,000</text><text class="tick" x="399.0" y="336" text-anchor="middle">3,000</text><text class="tick" x="570.0" y="336" text-anchor="middle">10,000</text><text class="tick" x="321.0" y="356" text-anchor="middle">records in the store</text><line class="axis" x1="72" x2="570" y1="316" y2="316"/><polyline class="line s2 dash" points="72.0,216.5 243.0,188.3 399.0,162.5 570.0,132.1"/><circle class="dot s2" cx="72.0" cy="216.5" r="5"><title>v0.1.0 cold: 300 records, 60 ms</title></circle><circle class="dot s2" cx="243.0" cy="188.3" r="5"><title>v0.1.0 cold: 1,000 records, 191 ms</title></circle><circle class="dot s2" cx="399.0" cy="162.5" r="5"><title>v0.1.0 cold: 3,000 records, 552 ms</title></circle><circle class="dot s2" cx="570.0" cy="132.1" r="5"><title>v0.1.0 cold: 10,000 records, 1,924 ms</title></circle><polyline class="line s1 dash" points="72.0,251.4 243.0,223.3 399.0,196.5 570.0,166.8"/><circle class="dot s1" cx="72.0" cy="251.4" r="5"><title>v0.2.3 cold: 300 records, 14 ms</title></circle><circle class="dot s1" cx="243.0" cy="223.3" r="5"><title>v0.2.3 cold: 1,000 records, 45 ms</title></circle><circle class="dot s1" cx="399.0" cy="196.5" r="5"><title>v0.2.3 cold: 3,000 records, 136 ms</title></circle><circle class="dot s1" cx="570.0" cy="166.8" r="5"><title>v0.2.3 cold: 10,000 records, 461 ms</title></circle><polyline class="line s1" points="72.0,296.6 243.0,274.5 399.0,248.0 570.0,217.8"/><circle class="dot s1" cx="72.0" cy="296.6" r="5"><title>v0.2.3 warm: 300 records, 2.2 ms</title></circle><circle class="dot s1" cx="243.0" cy="274.5" r="5"><title>v0.2.3 warm: 1,000 records, 5.5 ms</title></circle><circle class="dot s1" cx="399.0" cy="248.0" r="5"><title>v0.2.3 warm: 3,000 records, 16 ms</title></circle><circle class="dot s1" cx="570.0" cy="217.8" r="5"><title>v0.2.3 warm: 10,000 records, 57 ms</title></circle><text class="label" x="582.0" y="130.1">v0.1.0 cold</text><text class="value" x="582.0" y="146.1">1,924 ms</text><text class="label" x="582.0" y="164.8">v0.2.3 cold</text><text class="value" x="582.0" y="180.8">461 ms</text><text class="label" x="582.0" y="215.8">v0.2.3 warm</text><text class="value" x="582.0" y="231.8">57 ms</text></svg>
