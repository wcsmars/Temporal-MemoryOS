e class="line s1 dash" points="72.0,252.2 243.0,224.9 399.0,197.9 570.0,167.6"/><circle class="dot s1" cx="72.0" cy="252.2" r="5"><title>v0.2.2 cold: 300 records, 14 ms</title></circle><circle class="dot s1" cx="243.0" cy="224.9" r="5"><title>v0.2.2 cold: 1,000 records, 42 ms</title></circle><circle class="dot s1" cx="399.0" cy="197.9" r="5"><title>v0.2.2 cold: 3,000 records, 129 ms</title></circle><circle class="dot s1" cx="570.0" cy="167.6" r="5"><title>v0.2.2 cold: 10,000 records, 447 ms</title></circle><polyline class="line s1" points="72.0,302.6 243.0,277.0 399.0,248.6 570.0,217.5"/><circle class="dot s1" cx="72.0" cy="302.6" r="5"><title>v0.2.2 warm: 300 records, 1.7 ms</title></circle><circle class="dot s1" cx="243.0" cy="277.0" r="5"><title>v0.2.2 warm: 1,000 records, 5.0 ms</title></circle><circle class="dot s1" cx="399.0" cy="248.6" r="5"><title>v0.2.2 warm: 3,000 records, 16 ms</title></circle><circle class="dot s1" cx="570.0" cy="217.5" r="5"><title>v0.2.2 warm: 10,000 records, 57 ms</title></circle><text class="label" x="582.0" y="132.0">v0.1.0 cold</text><text class="value" x="582.0" y="148.0">1,780 ms</text><text class="label" x="582.0" y="165.6">v0.2.2 cold</text><text class="value" x="582.0" y="181.6">447 ms</text><text class="label" x="582.0" y="215.5">v0.2.2 warm</text><text class="value" x="582.0" y="231.5">57 ms</text></svg>
