[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "temporal-memory-os"
version = "0.2.0"
description = "Editable, auditable, time-aware memory for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["memory", "temporal", "retrieval", "markdown", "mcp"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: POSIX",
  "Topic :: Database",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/wcsmars/Temporal-MemoryOS"
Changelog = "https://github.com/wcsmars/Temporal-MemoryOS/blob/main/CHANGELOG.md"

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "pydantic>=2.8,<3", "uvicorn>=0.30,<1"]
mcp = ["mcp>=1.28,<2"]
semantic = ["sentence-transformers>=3,<6"]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.8,<1", "build>=1,<2"]

[project.scripts]
memoryos = "temporal_memory_os.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
