[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "temporal-memory-os"
version = "0.2.1"
description = "Editable, auditable, time-aware memory for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["memory", "temporal", "retrieval", "markdown", "mcp"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: POSIX",
  "Topic :: Database",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/wcsmars/Temporal-MemoryOS"
Changelog = "https://github.com/wcsmars/Temporal-MemoryOS/blob/main/CHANGELOG.md"

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "pydantic>=2.8,<3", "uvicorn>=0.30,<1"]
mcp = ["mcp>=1.28,<2"]
semantic = ["sentence-transformers>=3,<6"]
dev = [
  "pytest>=8,<9", "pytest-cov>=6,<8", "coverage[toml]>=7.10,<8", "hypothesis>=6.100,<7",
  "httpx>=0.27,<1", "ruff>=0.8,<1", "mypy>=1.13,<3", "build>=1,<2",
]
mutation = ["mutmut>=3.3,<4"]

[project.scripts]
memoryos = "temporal_memory_os.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["mutants"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["sentence_transformers", "sentence_transformers.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["temporal_memory_os"]
branch = true
# The CLI tests run the package in child processes; measure those too.
patch = ["subprocess"]
parallel = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 90

[tool.mutmut]
# The whole package is copied; only the core engine is mutated. Interfaces
# (CLI, HTTP, MCP, Git) are thin wrappers covered by their own tests.
source_paths = ["src"]
only_mutate = [
  "src/temporal_memory_os/store.py",
  "src/temporal_memory_os/models.py",
  "src/temporal_memory_os/retrieval.py",
  "src/temporal_memory_os/extraction.py",
  "src/temporal_memory_os/embeddings.py",
]
pytest_add_cli_args_test_selection = ["tests/"]
